name: Manuscript readiness

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: manuscript-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  arxiv-texlive-matrix:
    strategy:
      fail-fast: false
      matrix:
        texlive: [2024, 2026]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: xu-cheng/texlive-action@22c04326a5d855880f9d39bb955138bf11c6df80 # v3
        with:
          texlive_version: ${{ matrix.texlive }}
          run: |
            mkdir -p build/texlive-${{ matrix.texlive }}
            cd paper
            latexmk -outdir=../build/texlive-${{ matrix.texlive }} main.tex
            test -s ../build/texlive-${{ matrix.texlive }}/main.pdf

  readiness:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - name: Install LaTeX and arXiv source tools
        run: sudo apt-get update && sudo apt-get install --yes chktex lacheck latexmk texlive-latex-base texlive-latex-extra qpdf poppler-utils exiftool
      - name: Validate manifest
        run: python3 scripts/validate_manifest.py
      - name: Lint canonical LaTeX
        run: make latex-lint
      - name: Install pinned comparison tools
        run: uv venv --allow-existing && uv pip sync requirements-arxiv.txt
      - name: Build source package
        run: python3 scripts/build_submission.py
      - name: Audit review PDF and final LaTeX log
        run: python3 scripts/audit_pdf.py build/arxiv/main.pdf build/arxiv/main.log
      - name: Rebuild to prove deterministic packaging
        run: |
          cp build/arxiv/arxiv-source.tar.gz /tmp/arxiv-source-first.tar.gz
          python3 scripts/build_submission.py
          cmp /tmp/arxiv-source-first.tar.gz build/arxiv/arxiv-source.tar.gz
      - name: Build and validate cleaner and collector variants
        run: make arxiv-variants
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: arxiv-source-package
          path: build/arxiv/

  semantic-html:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install LaTeXML
        run: sudo apt-get update && sudo apt-get install --yes latexml texlive-latex-base texlive-latex-extra
      - name: Convert canonical source to semantic HTML
        run: mkdir -p build/html && cd paper && latexmlc --dest=../build/html/main.html --log=../build/html/main.latexml.log --format=html5 --strict main.tex
      - name: Validate semantic HTML
        run: python3 scripts/validate_html.py build/html/main.html
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: semantic-html-preview
          path: build/html/
